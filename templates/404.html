{% extends "base.html" %}

{% block title %}Page Not Found - Online Job Portal{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="stat-icon warning mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
    <i class="bi bi-question-circle"></i>
  </div>
  <h1 class="display-4 fw-bold mb-3">404 - Page Not Found</h1>
  <p class="lead text-muted max-w-500 mx-auto mb-4">
    {{ message or "The page or job opening you are looking for does not exist or may have expired." }}
  </p>
  <div class="d-flex justify-content-center gap-3">
    <a href="{{ url_for('index') }}" class="btn btn-primary-custom px-4 py-2">
      <i class="bi bi-house-door me-1"></i> Return Home
    </a>
    <a href="{{ url_for('job_search') }}" class="btn btn-outline-custom px-4 py-2">
      <i class="bi bi-search me-1"></i> Search Jobs
    </a>
  </div>
</div>
{% endblock %}
